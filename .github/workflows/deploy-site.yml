name: Deploy Website to GitHub Pages

# Коли запускається цей workflow:
on:
  # 1. АВТОМАТИЧНО після завершення бота
  workflow_run:
    workflows: ["Danish News Bot - Scheduled"]
    types:
      - completed

  # 2. При push змін в main
  push:
    branches: [main]

  # 3. Ручний запуск
  workflow_dispatch:

# Права для деплою на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускати паралельно (щоб не було конфліктів)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Build Hugo site
  # ============================================
  build:
    runs-on: ubuntu-latest

    # Запускаємо якщо: бот успішний АБО це push/manual
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      # 1. Checkout репозиторію
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Встановлення Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 3. Налаштування GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # 4. Fetch news from Supabase and generate markdown
      - name: Generate pages from Supabase
        run: |
          chmod +x scripts/generate-pages.sh
          ./scripts/generate-pages.sh
        continue-on-error: true

      # 5. Build сайту
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify
          
          echo "✅ Hugo build completed"
          echo "📁 Files in public/:"
          ls -la public/

      # 6. Upload artifact для деплою
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/public

  # ============================================
  # JOB 2: Deploy to GitHub Pages
  # ============================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
