name: Deploy Website to GitHub Pages

# Коли запускається цей workflow:
on:
  # 1. При push змін в website/ папку або main
  push:
    branches: [main]
    paths:
      - 'website/**'

  # 2. Ручний запуск
  workflow_dispatch:

# Права для деплою на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не запускати паралельно (щоб не було конфліктів)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================
  # JOB 1: Build Hugo site
  # ============================================
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout репозиторію
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Потрібно для Git info в Hugo

      # 2. Встановлення Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true  # Потрібно для SCSS

      # 3. Налаштування GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # 4. Build сайту
      - name: Build with Hugo
        working-directory: website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify
          
          echo "✅ Hugo build completed"
          echo "📁 Files in public/:"
          ls -la public/
          echo "📄 Content of public/index.html (first 50 lines):"
          head -50 public/index.html || echo "No index.html found"

      # 5. Upload artifact для деплою
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/public

  # ============================================
  # JOB 2: Deploy to GitHub Pages
  # ============================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build  # Чекаємо завершення build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
