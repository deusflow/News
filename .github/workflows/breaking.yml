name: Danish News Bot - Breaking News

on:
  schedule:
    # Check for acute Danish emergencies every 20 mins between 05:00 and 21:00 UTC (zero AI used if calm)
    - cron: '*/20 5-21 * * *'
  repository_dispatch:
    types: [breaking_news]
  workflow_dispatch:
    inputs:
      title:
        description: 'Breaking News Title (leave empty for auto-detection)'
        required: false
      url:
        description: 'Breaking News URL (leave empty for auto-detection)'
        required: false

concurrency:
  group: breaking-scan
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_POSTGRES: 'true'

      # Breaking data comes either from dispatch payload or manual input
      BREAKING_TITLE: ${{ github.event.client_payload.title || github.event.inputs.title }}
      BREAKING_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}

      # AI settings
      MAX_AI_REQUESTS: 2
      MAX_GEMINI_REQUESTS: 2
      BOT_MODE: breaking

      # API Keys and Tokens
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      AI_PROVIDERS: "gemini,groq,groq:qwen/qwen3.8-27b"

      GO111MODULE: 'on'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Prepare deps and build
        run: |
          go mod download
          mkdir -p bin
          go build -o bin/dknews ./cmd/dknews
        working-directory: ${{ github.workspace }}

      - name: Publish Breaking News
        run: |
          echo "🚨 Starting Danish News Bot (Breaking Mode)..."
          ./bin/dknews -mode=breaking
        working-directory: ${{ github.workspace }}
