name: Danish News Bot - Monthly Calendar

on:
  schedule:
    # Run on the 28th of every month at 17:00 UTC (18:00/19:00 in Denmark)
    - cron: '0 17 28 * *'
  workflow_dispatch:
    inputs:
      target_month:
        description: 'Target Month ("next", "current", or month number 1-12 / name)'
        required: false
        default: 'next'

concurrency:
  group: monthly-calendar
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_POSTGRES: 'true'

      # Target Month override for manual run
      CALENDAR_TARGET_MONTH: ${{ github.event.inputs.target_month || '' }}

      # Supabase (for archive and secondary source)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # AI settings
      MAX_AI_REQUESTS: 2
      MAX_GEMINI_REQUESTS: 2
      BOT_MODE: calendar

      # API Keys and Tokens
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      AI_PROVIDERS: "gemini,groq,groq:qwen/qwen3.8-27b"

      GO111MODULE: 'on'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Prepare deps and build
        run: |
          go mod download
          mkdir -p bin
          go build -o bin/dknews ./cmd/dknews
        working-directory: ${{ github.workspace }}

      - name: Run Monthly Calendar
        run: |
          echo "📅 Starting Danish News Bot (Monthly Calendar Mode)..."
          ./bin/dknews -mode=calendar
        working-directory: ${{ github.workspace }}
