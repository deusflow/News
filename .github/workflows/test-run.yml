name: 🧪 TEST Channel Launch

on:
  workflow_dispatch: # Запуск только вручную по кнопке

jobs:
  test-run:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dknews_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # === КЛЮЧИ ТЕСТОВОГО КАНАЛА ===
      # Тут мы подставляем твои специальные секреты для тестов
      TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}

      # === НАСТРОЙКИ AI (Тестируем новый Fallback) ===
      # Используем ту же логику, что и в основном боте
      AI_PROVIDERS: "gemini,groq,groq:openai/gpt-oss-20b"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}

      # === БЕЗОПАСНЫЙ РЕЖИМ (SAFE MODE) ===
      # Отключаем PostgreSQL для прогона бота в канал, чтобы не трогать прод
      USE_POSTGRES: 'false'

      # Используем файловый кэш (он создастся временно в контейнере)
      CACHE_FILE_PATH: "test_cache.json"

      # URL локального тестового PostgreSQL контейнера для live-тестов
      TEST_DATABASE_URL: "postgres://postgres:postgrespassword@localhost:5432/dknews_test?sslmode=disable"

      # === ОСТАЛЬНЫЕ НАСТРОЙКИ ===
      MAX_NEWS_LIMIT: 3             # Берем мало новостей для теста
      BOT_MODE: single
      SCRAPE_CONCURRENCY: 2
      ENABLE_INLINE_BUTTONS: 'true'

      # Технические переменные
      GO111MODULE: 'on'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x' # Используем свежую версию, как в go.mod
          cache: true

      - name: Prepare deps
        run: |
          go mod download
          mkdir -p bin

      - name: 🧪 Run Go Tests (Unit & Live PostgreSQL Integration)
        run: |
          go test -v ./...

      - name: Build
        run: go build -o bin/dknews ./cmd/dknews


      - name: 🚀 Run on TEST Channel
        run: |
          echo "🧪 Running on TEST CHANNEL..."
          echo "Database: DISABLED (Temporary File Cache)"
          echo "AI Providers: $AI_PROVIDERS"
          ./bin/dknews