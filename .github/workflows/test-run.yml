name: 🧪 TEST Run (Safe Mode)

on:
  workflow_dispatch: # Запуск только вручную по кнопке!

jobs:
  run-test-bot:
    runs-on: ubuntu-latest

env:
      USE_POSTGRES: false
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ENABLE_WEBSITE: false
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      
      # === НАСТРОЙКИ ДЛЯ ТЕСТА (OPENROUTER) ===
      # Мы "обманываем" программу: подсовываем ей ключ OpenRouter вместо Groq
      GROQ_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      
      # Переключаем адрес на OpenRouter
      AI_BASE_URL: "https://openrouter.ai/api/v1"
      
      # Модель: Gemini 2.0 Flash Lite (бесплатная и умная)
      GROQ_MODEL: "google/gemini-2.0-flash-lite-preview-02-05:free"
      
      MAX_NEWS_LIMIT: 5
      BOT_MODE: multiple
      SCRAPE_CONCURRENCY: 2
      ENABLE_INLINE_BUTTONS: true
      INLINE_BUTTON_MODE: url
      GO111MODULE: on

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Prepare deps
        run: |
          go mod download
          mkdir -p bin

      - name: Build
        run: go build -o bin/dknews ./cmd/dknews

      - name: 🚀 Run TEST Bot
        run: |
          echo "🧪 Running in SAFE TEST MODE..."
          echo "Database is DISABLED (File Cache only)"
          ./bin/dknews
