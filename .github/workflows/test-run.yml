name: 🧪 TEST Channel Launch

on:
  workflow_dispatch: # Запуск только вручную по кнопке

jobs:
  test-run:
    runs-on: ubuntu-latest

    env:
      # === КЛЮЧИ ТЕСТОВОГО КАНАЛА ===
      # Тут мы подставляем твои специальные секреты для тестов
      TELEGRAM_TOKEN: ${{ secrets.TEST_TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}

      # === НАСТРОЙКИ AI (Тестируем новый Fallback) ===
      # Используем ту же логику, что и в основном боте
      AI_PROVIDERS: "gemini,groq"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # === БЕЗОПАСНЫЙ РЕЖИМ (SAFE MODE) ===
      # Для feedback-кнопок нужен PostgreSQL. Используем отдельный TEST_DATABASE_URL,
      # если он задан в Secrets; иначе останемся на file cache.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ENABLE_SUPABASE: 'false'
      ENABLE_WEBSITE: 'false'

      # Используем файловый кэш (он создастся временно в контейнере)
      CACHE_FILE_PATH: "test_cache.json"

      # === ОСТАЛЬНЫЕ НАСТРОЙКИ ===
      MAX_NEWS_LIMIT: 3             # Берем мало новостей для теста
      BOT_MODE: multiple
      SCRAPE_CONCURRENCY: 2
      ENABLE_INLINE_BUTTONS: 'true'
      ENABLE_FEEDBACK_BUTTONS: 'true'

      # Технические переменные
      GO111MODULE: 'on'
      WORKFLOW_REV: 'test-run-v2-db-required'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x' # Используем свежую версию, как в go.mod

      - name: Prepare deps
        run: |
          go mod download
          mkdir -p bin

      - name: Preflight env checks
        run: |
          echo "Workflow ref: ${{ github.workflow_ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          echo "Workflow rev: $WORKFLOW_REV"

          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "ERROR: TEST_DATABASE_URL is empty or missing."
            echo "ERROR: Cannot enable PostgreSQL, feedback buttons will not work."
            exit 1
          fi

          echo "TEST_DATABASE_URL is set (value hidden), length: ${#TEST_DATABASE_URL}"

      - name: Build
        run: go build -o bin/dknews ./cmd/dknews

      - name: 🚀 Run on TEST Channel
        run: |
          echo "🧪 Running on TEST CHANNEL..."
          export DATABASE_URL="$TEST_DATABASE_URL"
          export USE_POSTGRES='true'
          echo "Database: TEST PostgreSQL ENABLED (feedback buttons active)"
          echo "Flags: ENABLE_INLINE_BUTTONS=$ENABLE_INLINE_BUTTONS, ENABLE_FEEDBACK_BUTTONS=$ENABLE_FEEDBACK_BUTTONS, USE_POSTGRES=$USE_POSTGRES"
          echo "AI Providers: $AI_PROVIDERS"
          ./bin/dknews

