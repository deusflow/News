name: Sunday Digest Bot

on:
  schedule:
    - cron: '0 18 * * 0' # Every Sunday at 18:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Wait, go.mod uses 1.26. We will use ~1.23 if 1.26 isn't available yet in standard runners, but we'll stick to 1.26 or just whatever is compatible.
          cache: true

      - name: Build Bot
        run: go build -o bot cmd/dknews/main.go

      - name: Run Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_MODE: digest
        run: ./bot -mode=digest
