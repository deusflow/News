# Конфігурація Hugo для dknews
baseURL = "https://deusflow.github.io/News/"
languageCode = "uk"
title = "DK News — Новини Данії"
buildFuture = true
relativeURLs = true
uglyURLs = false

# Використовуємо власні layouts без теми
disableKinds = ["taxonomy", "term"]

[params]
  description = "Новини Данії українською та данською мовами"
  author = "DK News Bot"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Дозволяє HTML в markdown

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[permalinks]
  posts = "/news/:year/:month/:slug/"
