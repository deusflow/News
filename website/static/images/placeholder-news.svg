<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DaUa NEWS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#151A22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(780 260) rotate(140) scale(520 380)">
      <stop stop-color="#FF0055" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF0055" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M-40 520C120 410 340 410 520 480C700 550 900 570 1240 430" stroke="#8CC8FF" stroke-opacity="0.18" stroke-width="120" filter="url(#soft)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Minimal emblem (compass / locator) -->
  <g transform="translate(920 155)">
    <circle cx="80" cy="80" r="58" stroke="#FF0055" stroke-opacity="0.75" stroke-width="6"/>
    <path d="M80 42L98 98L80 118L62 98L80 42Z" fill="#FF0055" fill-opacity="0.85"/>
    <circle cx="80" cy="80" r="10" fill="#0B0E14"/>
  </g>

  <!-- Brand -->
  <g transform="translate(110 240)">
    <rect x="0" y="0" width="130" height="54" rx="6" fill="#FF0055"/>
    <text x="65" y="36" text-anchor="middle" font-family="Lato, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">DaUa</text>

    <text x="150" y="38" font-family="Lato, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">NEWS</text>

    <text x="0" y="90" font-family="Lato, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.34em" fill="#B7C0D0" opacity="0.9">INDEPENDENT DIGEST • DENMARK</text>

    <rect x="0" y="118" width="560" height="2" fill="#FF0055" fill-opacity="0.55"/>
    <text x="0" y="160" font-family="Lato, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="600" fill="#D9DEEA" opacity="0.92">Bilingual news for Ukrainians in Denmark</text>
